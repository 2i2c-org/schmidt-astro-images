channels:
  - conda-forge

dependencies:
  # DSA-2000 pulsar notebooks: PSRCHIVE and tempo2 are conda-forge only
  - psrchive
  - tempo2

  # for Argus, these are also conda-forge only (sncosmo needs gcc otherwise)
  - sncosmo
  - boto3>=1.43.1  # litellm (pip, below) needs >=1.43.1; solving it here keeps botocore consistent with aiobotocore/s3fs  

  # VISS agentic-ai workshop (schmidt-sciences/viss-agentic-ai-workshop-tsos-2026).
  # Mirrors its pyproject.toml. `pint` is deliberately omitted: nothing in the repo imports it, and
  # its module name collides with pint-pulsar (pulled in by convening2026-release below).
  # pandas>=3 is above the pangeo base's own pin; a dry-run solve found no removals.
  - pandas>=3.0.3
  - numpy>=2
  - scipy>=1.17.1
  - statsmodels>=0.14.6
  - pytest>=8.3
  - python-dotenv

  - pip:
      # Lazuli. The IFS and ESC notebooks need slicersim 1.3.4 (LazuliKilonova);
      # PyPI is at 1.3.0, so pin the GitHub commit until Mickael releases it.
      - slicersim @ git+https://github.com/MickaelRigault/slicersim.git@de16061bf3aca49128d1a872ca9408f816ec31de
      - wcc-etc[lightcurve]   # transit notebooks need jaxoplanet via lazuli-exo[transit]
      - esc-etc
      - wcc-sim
      - lazuli-exo

      # Argus (argus_sim is not on PyPI; it lives in the hackathon repo)
      - argus_sim @ git+https://github.com/schmidt-observatories/science-symposium-2026-hackathon-materials.git#subdirectory=argus/argus_survey_model
      - redback # needed for tutorial_survey_data.ipynb but not listed as dep so adding here

      # VISS notebooks talk to the gateway through the litellm SDK. Pinned (the VISS repo asks for
      # >=1.50.0): it sits next to the gateway credentials and its boto3 floor already forced the
      # conda boto3 pin above. Bump deliberately and re-run the build checks.
      - litellm==1.105.1

      # DSA-2000 helper package, same repo
      - convening2026-release @ git+https://github.com/schmidt-observatories/science-symposium-2026-hackathon-materials.git#subdirectory=dsa/convening2026-release-2026.9.28
