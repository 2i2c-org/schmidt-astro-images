channels:
  - conda-forge

dependencies:
  # DSA-2000 pulsar notebooks: PSRCHIVE and tempo2 are conda-forge only
  - psrchive
  - tempo2

  # for Argus, these are also conda-forge only (sncosmo needs gcc otherwise)
  - sncosmo
  - boto3

  # Some AI tooling
  - jupyter-ai=3.2
  - nodejs

  # VISS agentic-ai workshop (schmidt-sciences/viss-agentic-ai-workshop-tsos-2026).
  # Mirrors its pyproject.toml. `pint` is deliberately omitted: nothing in the repo imports it, and
  # its module name collides with pint-pulsar (pulled in by convening2026-release below).
  # pandas>=3 is above the pangeo base's own pin; a dry-run solve found no removals.
  - pandas>=3.0.3
  - numpy>=2
  - scipy>=1.17.1
  - statsmodels>=0.14.6
  - pytest>=8.3
  - python-dotenv

  # VISS workshop: ovro-lwa-portal and astrowidget need Zarr v2, so these pins downgrade
  # zarr, xarray, dask and numcodecs for the whole image.
  - zarr>=2.18.7,<3
  - xarray<2026
  - dask<2026
  - numcodecs>=0.15,<0.16
  # litellm (pip, below) needs boto3>=1.43.1. Let conda install it so boto3, aiobotocore and s3fs
  # stay compatible; if pip upgrades boto3 instead, it falls back to s3fs 0.4.2.
  - boto3>=1.43.1

  - pip:
      # Lazuli. The IFS and ESC notebooks need slicersim
      - slicersim
      - wcc-etc[lightcurve]   # transit notebooks need jaxoplanet via lazuli-exo[transit]
      - esc-etc
      - wcc-sim
      - lazuli-exo
      - lazuli-astrosim-data 
      - skysurvey 

      # Argus (argus_sim is not on PyPI; it lives in the hackathon repo)
      - argus_sim @ git+https://github.com/schmidt-observatories/science-symposium-2026-hackathon-materials.git#subdirectory=argus/argus_survey_model
      - redback # needed for tutorial_survey_data.ipynb but not listed as dep so adding here

      # DSA-2000 helper package, same repo
      - dsahackathon2026-release @ git+https://github.com/schmidt-observatories/science-symposium-2026-hackathon-materials.git#subdirectory=dsa/hackathon2026

      # VISS notebooks talk to the gateway through the litellm SDK. Pinned (the VISS repo asks for
      # >=1.50.0). It requires a newer boto3, which is bumped up earlier.
      - litellm==1.105.1

      # VISS workshop, see the Zarr v2 pins above
      - astrowidget==0.2.0
      - ovro-lwa-portal @ git+https://github.com/ovro-lwa/ovro-lwa-portal.git@809aaf49c8723334d03be4088cbb4d795381d333

      # SSEC Tutorial
      # Block 2's notebook imports `workshop_agent` from the subdirectory below.
      # The `starter` code must be installed as 'editable' in participants *HOME* folders so that code changes are reflected.
      # 1. https://github.com/schmidt-sciences/viss-agentic-ai-workshop-tsos-2026 gets pulled with an nbgitpuller link
      # 2. participants must run `pip install --user -e ~/viss-agentic-ai-workshop-tsos-2026/blocks/01-landscape/demo/starter`
      - workshop-agent @ git+https://github.com/schmidt-sciences/viss-agentic-ai-workshop-tsos-2026.git@main#subdirectory=workshop_agent
